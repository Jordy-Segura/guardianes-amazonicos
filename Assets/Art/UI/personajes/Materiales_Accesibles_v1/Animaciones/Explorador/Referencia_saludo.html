<!doctype html><html lang="es"><meta charset="utf-8"><title>Explorador · Saludo fluido</title><style>body{margin:0;text-align:center;background:#edf6ef;color:#18442f;font:18px Arial}h1{font-size:24px;margin:12px}canvas{height:80vh;max-width:95vw;object-fit:contain;background:#cee9e5;border-radius:18px}button{display:block;margin:10px auto;font:inherit;padding:8px 20px}</style><h1>Saludo fluido · Cuerpo fijo y brazo animado</h1><canvas id="lienzo" width="1024" height="1536"></canvas><button>Pausar / continuar</button><script>const c=document.getElementById('lienzo'),ctx=c.getContext('2d');const body=new Image(),arm=new Image();body.src='Capas/Cuerpo.png';arm.src='Capas/Brazo.png';window.ready=Promise.all([body.decode(),arm.decode()]);window.draw=function(phase){ctx.clearRect(0,0,1024,1536);ctx.drawImage(body,0,0);ctx.save();ctx.beginPath();ctx.moveTo(716,590);ctx.bezierCurveTo(704,620,705,690,718,725);ctx.lineTo(1024,725);ctx.lineTo(1024,0);ctx.lineTo(716,0);ctx.closePath();ctx.clip();ctx.translate(720,670);ctx.rotate((3+Math.sin(phase)*6)*Math.PI/180);ctx.scale(.8,.8);ctx.translate(-685,-810);ctx.drawImage(arm,0,0);ctx.restore();};let run=true;document.querySelector('button').onclick=()=>run=!run;let time=0,last=0;function tick(t){if(last&&run)time+=(t-last)/1000;last=t;draw(time*2*Math.PI/(40/24));requestAnimationFrame(tick)}ready.then(()=>{draw(0);if(!location.hash.includes('export'))requestAnimationFrame(tick)});</script></html>
