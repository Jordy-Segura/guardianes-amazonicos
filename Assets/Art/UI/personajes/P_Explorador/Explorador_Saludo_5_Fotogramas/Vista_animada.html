<!doctype html><html lang="es"><meta charset="utf-8"><title>Explorador · Saludo</title><style>body{font:18px Arial;text-align:center;background:#edf6ef;color:#17422e}img{height:72vh;max-width:95vw;object-fit:contain;background:#cee9e5;border-radius:16px}button,input{font:inherit;margin:12px}p{max-width:700px;margin:16px auto}</style><h1>Explorador · Saludo en cinco fotogramas</h1><img id="sprite" src="Fotogramas/Explorador_Saludo_01.png"><div><button onclick="playing=!playing">Pausar / continuar</button><label>Velocidad <input id="speed" type="range" min="2" max="12" value="6"> <span id="fps">6</span> imágenes/s</label></div><p>Prueba de animación por fotogramas. Hay pequeñas variaciones del dibujo entre imágenes; revisa el movimiento antes de integrarlo.</p><script>const images=Array.from({length:5},(_,i)=>{let a=new Image();a.src='Fotogramas/Explorador_Saludo_0'+(i+1)+'.png';return a});let playing=true,i=0,last=0;function tick(t){let rate=+speed.value;fps.textContent=rate;if(playing&&t-last>=1000/rate){sprite.src=images[i].src;i=(i+1)%5;last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
